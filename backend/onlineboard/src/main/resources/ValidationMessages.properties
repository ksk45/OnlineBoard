# バリデーションエラー用メッセージ
VALIDATION_REQUIRED={0}は必須です
VALIDATION_MAX_LENGTH={max}文字以内で入力してください
VALIDATION_MIN_LENGTH={min}文字以上で入力してください
VALIDATION_LENGTH={min}文字以上、{max}文字以内で入力してください
VALIDATION_EMAIL_FORMAT=有効なメールアドレス形式で入力してください
VALIDATION_PASSWORD_COMPLEXITY=英字と数字を両方含めてください
VALIDATION_PASSWORD_MISMATCH=パスワードが一致しません

VALIDATION_USER_CONTEXT_INVALID=ユーザーコンテキストが不正です